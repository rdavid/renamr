#
# Builds and publishes the gem on version tags. The tests run first, so a
# failing build is never published. The id-token:write permission
# authenticates the push to RubyGems with OIDC, so no stored credentials are
# needed. The contents:write permission lets the last step create a GitHub
# release with generated notes.
---
name: release
'on':
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1.329.0
        with:
          ruby-version: '3.4'
      - name: Verify the tag matches the gem version
        run: |
          ver="$(ruby -Ilib -rrenamr/version -e 'puts Renamr::VERSION')"
          test "$ver" = "$GITHUB_REF_NAME"
      - run: bundle install
      - run: bundle exec rake
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - run: gem build renamr.gemspec
      - run: gem push "renamr-$GITHUB_REF_NAME.gem"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "renamr-$GITHUB_REF_NAME.gem"
