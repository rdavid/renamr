#
# Checks the links in the gem, configuration, and documentation with lychee,
# which reads its exclusions from lychee.toml. Runs on every push and pull
# request with no path filter on purpose. A link can appear in any file.
# The weekly schedule reports a dead link even when the repository is quiet.
# The token raises the GitHub rate limit for the many github.com links.
---
name: lychee
'on':
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lychee:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --max-retries 3
            --no-progress
            '.github/**/*.yml'
            '.github/pages/*.html'
            Gemfile
            README.adoc
            renamr.gemspec
          fail: true
          lycheeVersion: v0.24.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
