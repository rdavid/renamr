#
# Builds README.adoc into the project's GitHub Pages site. The build job
# renders the page and fails on any Asciidoctor warning. Pull requests run
# only the build, so a broken page is caught before the merge. The deploy job
# publishes the page from master. It needs pages:write to publish and
# id-token:write to authenticate the deployment with OIDC.
---
name: pages
'on':
  pull_request:
    paths: &paths
      - .github/pages/**
      - .github/workflows/pages.yml
      - README.adoc
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: sh
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes asciidoctor
      - run: |
          mkdir _site
          cp .github/pages/favicon.svg _site/favicon.svg
          asciidoctor \
            --attribute docinfo=private \
            --attribute docinfodir=.github/pages \
            --attribute pages-build \
            --failure-level WARN \
            --out-file _site/index.html \
            README.adoc
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
